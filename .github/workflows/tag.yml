name: tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH tag signing
        env:
          TAG_SIGNING_KEY: ${{ secrets.TAG_SIGNING_KEY }}
        run: |
          if [ -z "$TAG_SIGNING_KEY" ]; then
            echo "TAG_SIGNING_KEY secret is not set; refusing to publish an unsigned tag"; exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAG_SIGNING_KEY" > ~/.ssh/tag_signing
          chmod 600 ~/.ssh/tag_signing
          git config user.name "tutien-release"
          git config user.email "release@tutien"
          git config gpg.format ssh
          git config user.signingkey ~/.ssh/tag_signing

      - name: Tag the release named in plugin.json
        run: |
          next="v$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "$next already tagged; bump .claude-plugin/plugin.json version to release"; exit 0
          fi
          git tag -s "$next" -m "$next"
          git push origin "$next"
          echo "Tagged $next"
